<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/look-away.css">
</head>
<body>
    <div class="look-away-container" id="container">
        <div class="look-away-title">Look away</div>
        <div class="look-away-hint">Focus on something ~20 feet / 6 m away</div>
        <div class="look-away-countdown" id="countdown" aria-live="polite">20</div>
        <div class="look-away-unit">seconds</div>
        <div class="look-away-buttons">
            <button class="look-away-button skip" type="button">Skip</button>
            <button class="look-away-button snooze" type="button">Snooze (5 min)</button>
        </div>
    </div>
    <script src="js/shared/theme.js"></script>
    <script src="js/look-away.js"></script>
</body>
</html>
